
services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: cambiar_root_123
      MYSQL_DATABASE: gestion_academica
      MYSQL_USER: mi_usuario
      MYSQL_PASSWORD: cambiar_usuario_123
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
